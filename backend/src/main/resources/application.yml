server:
  port: 8180

spring:
  application:
    name: wrj-platform
  datasource:
    url: jdbc:h2:file:./data/wrj;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.wrj: info
